# User-facing text shown in info and warning tooltips.
#
# Editing rules:
# - Wrap ordinary text across lines as needed; it is displayed as one paragraph.
# - Use a blank line to separate titled sections, such as "Berechnung" and
#   "Bedeutung".

[common]
prior_period = """
Vorperiode ist immer derselbe Zeitraum davor.
Beispiel: Bei 4 ausgewählten Tagen werden die 4 Tage davor verglichen.
"""

[reporting]
invoicing_warning = """
Diese Werte basieren auf Messdaten der vor Ort verbauten Zähler und
Wechselrichter (Microgrid-Messung). Kosten, Erlöse und Preise sind
Prognosen auf Basis dieser Messwerte. Sie können von den abrechnungsrelevanten
Daten des Netzbetreibers abweichen und dienen nur der Information
und Steuerung, nicht der Abrechnung.
"""
incomplete_dso_data_warning = """
Messdaten des Netzbetreibers unvollständig

Für den gewählten Zeitraum liegen keine oder nur teilweise Messdaten des
Netzbetreibers vor.

Mögliche Gründe:
- Der Netzbetreiber stellt seine Daten in der Regel erst mit etwa einem Tag
  Verzögerung bereit (24 h). Setzen Sie das Enddatum daher mindestens einen Tag
  zurück.
- Für Teile des gewählten Zeitraums wurden vom Netzbetreiber noch keine Daten
  übermittelt. Beispiel: Sie haben Januar bis Juni ausgewählt, aber
  Netzbetreiberdaten liegen erst ab Februar vor.
"""

[battery_optimization]
total_savings = """
Entladewert minus Ladekosten.
Berechnung: Summe(entladene kWh * Day-Ahead-Preis) -
Summe(geladene kWh * Day-Ahead-Preis).
"""

discharging_value_eur = """
Berechnung
Je Viertelstunde: entladene Menge * Day-Ahead-Preis dieser Viertelstunde,
über den Zeitraum summiert.

Bedeutung
Marktwert der entladenen Energie zum Zeitpunkt der Entladung. Da nicht
eingespeist wird, deckt sie Eigenverbrauch und ersetzt Netzbezug.
"""

charging_cost_eur = """
Berechnung
Je Viertelstunde: geladene Menge * Day-Ahead-Preis dieser Viertelstunde,
über den Zeitraum summiert.

Bedeutung
Marktwert der geladenen Energie zum Zeitpunkt der Beladung, unabhängig
davon, ob sie aus dem Netz oder aus Eigenerzeugung stammt.
"""

battery_efficiency_pct = """
Geschätzter Wirkungsgrad aus Lade- und Entladeenergie im ausgewählten Zeitraum.
Berechnung: entladene Energie / geladene Energie * 100.

Die Kennzahl wird nur angezeigt, wenn die geladene Energie die entladene
Energie abdeckt. Ist sie nicht verfügbar, wurde zu Beginn des Zeitraums bereits
gespeicherte Energie entladen; daraus lässt sich kein Wirkungsgrad ableiten.
"""

battery_discharging_kwh = """
Gesamte aus der Batterie entladene Energiemenge im ausgewählten Zeitraum.
"""

battery_charging_kwh = """
Gesamte in die Batterie geladene Energiemenge im ausgewählten Zeitraum.
"""

value_per_mwh_throughput = """
Kostenwirkung je bewegter Batterieenergie.
Berechnung: Kostenwirkung / ((geladene kWh + entladene kWh)).
"""

battery_price_spread_eur_per_mwh = """
Durchschnittlicher Entladepreis minus durchschnittlicher Ladepreis.
Berechnung: Entladewert / entladene MWh - Ladekosten / geladene MWh.
"""

value_per_mwh_discharged = """
Kostenwirkung je abgegebener Batterieenergie.
Berechnung: Kostenwirkung / (entladene kWh).
"""

value_per_kwh_capacity = """
Kostenwirkung relativ zur installierten Batteriekapazität.
Berechnung: Kostenwirkung / Batteriekapazität (kWh).
"""

battery_cycles = """
Äquivalente Vollzyklen der Batterie.
Berechnung: (geladene Energie + entladene Energie) (kWh) /
(2 * Batteriekapazität (kWh)).
"""
